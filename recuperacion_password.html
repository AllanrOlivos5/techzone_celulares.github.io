<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablecimiento Password</title>
    <!-- Enlazamos su propio archivo de estilos -->
    <link rel="stylesheet" href="estilos_css/estilo_recuperacion_password.css">
</head>
<body>

    <h1>TECH ZONE - celulares</h1>
    <h1>Tecnología a tu alcance</h1>
    <br>

    <div class="caja-recuperacion">
        <h2>Restablece tu contraseña</h2>
        <br>
        <label>Seleccione el tipo de documento y digite el numero de identificación.</label>
        
        <form action="index.html">
            <br>
            <select name="tipo_doc">
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="CE">Cédula de Extranjería</option>
                <option value="TI">Tarjeta de Identidad</option>
                <option value="PEP">PEP</option>
                <option value="">Permiso por Protección Temporal</option>
            </select>
            
            <br><br>
            <label>Número de documento:</label>
            <br>
            <input type="number" name="id_usuario" required>
            
            <br><br>
            <label>Nueva Password:</label>
            <br>
            <input type="password" name="password_nuevo" required>
            
            <br><br>
            <input type="submit" name="Restablecer" value="Restablecer" class="btn-enviar">
        </form>
    </div>

</body>
</html>
